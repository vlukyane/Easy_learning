[project]
name = "warmstart"
version = "0.1.0"
description = "Three-layer LLM cache with measured false-hit rate"
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "pydantic>=2",
  "python-dotenv",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
