[project]
name = "slotfill"
version = "0.1.0"
description = "Invoice slot filling: prompt vs LoRA"
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "pydantic>=2",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]
train = ["torch", "transformers", "peft", "datasets"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
