name: eval-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  recall:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/groundtruth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/ci_eval.py
